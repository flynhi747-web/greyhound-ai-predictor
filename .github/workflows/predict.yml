name: Greyhound Winner Predictor V3

on:
  workflow_dispatch:
    inputs:
      max_races:
        description: "Number of strongest upcoming races to display"
        required: false
        default: "8"

permissions:
  contents: read

jobs:
  predict:
    name: Run Greyhound Predictor V3
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run V3 predictor
        env:
          BOT_TIMEZONE: Australia/Brisbane
          MAX_RACES: ${{ github.event.inputs.max_races }}
          PUNTERSEDGE_API_KEY: ${{ secrets.PUNTERSEDGE_API_KEY }}
        run: python predictor_v3.py

      - name: Create prediction summary
        if: always()
        shell: bash
        run: |
          echo "# 🐕 Greyhound AI Predictor V3" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f predictions.md ]; then
            cat predictions.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f predictions.txt ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat predictions.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ No predictions were produced." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the **Run V3 predictor** step above to see the error." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload prediction results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greyhound-predictions-v3
          path: |
            predictions.md
            predictions.txt
            predictions.json
            debug/
          if-no-files-found: ignore
          retention-days: 7
